name: pipeline-tests

on:
  push:
  pull_request:

jobs:
  end-to-end:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # matches Fabric Runtime 1.3
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: pip install -r requirements-dev.txt
      - name: Generate SAP extract and run notebooks 01-04 on local Spark
        run: python tests/run_pipeline_locally.py --scale 0.5
